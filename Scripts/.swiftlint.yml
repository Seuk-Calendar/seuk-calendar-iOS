# .swiftlint.yml

excluded:
  - "../**/NeedleGenerated.swift"

# 일반적인 설정
opt_in_rules:
  # 강제 언래핑 시 경고
  - force_unwrapping

# 강제 캐스팅 시 경고
force_cast:
    warning

# 강제 try 시 에러
force_try:
    error

# 중괄호 앞 띄어쓰기 안할 시 경고
opening_brace:
  severity: warning # 명시적으로 선언

# 2연속 줄바꿈 제한
vertical_whitespace:
  severity: warning

# 변수명에 _(언더스코어) 허용
identifier_name:
  allowed_symbols: "_"

# 코드 글자 수 한 줄당 120자 제한
line_length:
  warning: 120

# 함수 길이 제한
function_body_length:
  warning: 100
  error: 300

# 함수 파라미터 갯수 제한
function_parameter_count:
  warning: 10
  error: 15
