name: "Todo"
description: "할 일 추가"
labels: ["📋 TODO"]
body:
  - type: textarea
    attributes:
      label: 요약(Summary)
      description: |
        작업에 대한 간단한 요약을 작성해주세요.
      placeholder: |
        홈 화면 피드 목록 UI 구현
  - type: textarea
    attributes:
      label: 배경(Background)
      description: |
        이 작업이 필요한 이유와 맥락을 설명해주세요.
      placeholder: |
        현재 홈 화면에 피드 목록이 없어 사용자가 콘텐츠를 탐색할 수 없습니다.
        사용자 경험 개선을 위해 스크롤 가능한 피드 목록이 필요합니다.
  - type: textarea
    attributes:
      label: 솔루션 제안(Proposed Solution)
      description: |
        어떻게 구현할지 구체적인 방법을 작성해주세요.
      placeholder: |
        - UICollectionView를 사용한 피드 목록 구현
        - 무한 스크롤 페이징 처리
        - 이미지 캐싱 및 lazy loading 적용
        - 스켈레톤 UI 로딩 상태 표시
  - type: textarea
    attributes:
      label: 작업 완료 기준(Acceptance Criteria)
      description: |
        이 작업이 완료되었다고 판단할 수 있는 기준을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 피드 목록이 정상적으로 표시됨
        - [ ] 스크롤이 부드럽게 동작함
        - [ ] 무한 스크롤 페이징이 정상 작동함
        - [ ] 이미지 로딩이 최적화됨
        - [ ] 로딩 상태가 명확히 표시됨
  - type: textarea
    attributes:
      label: 원본 제안(Original Suggestion)
      description: |
        사용자가 제안한 원본 내용이나 추가 정보를 작성해주세요.
      placeholder: |
        - 참고 자료 링크
        - 디자인 시안
        - 관련 이슈 번호

