name: "Bug"
description: "버그 제보"
labels: ["🐞 BUG"]
body:
  - type: textarea
    attributes:
      label: 요약(Summary)
      description: |
        버그에 대한 간단한 요약을 작성해주세요.
      placeholder: |
        편집 모드에서 저장 버튼이 동작하지 않는 문제
  - type: textarea
    attributes:
      label: 배경(Background)
      description: |
        버그가 발생하는 상황과 맥락을 설명해주세요.
      placeholder: |
        사용자가 게시물을 편집하고 저장 버튼을 누를 때, 아무 반응이 없습니다.
        이 문제는 iOS 16 이상에서만 발생하는 것으로 보입니다.
  - type: textarea
    attributes:
      label: 솔루션 제안(Proposed Solution)
      description: |
        버그를 해결하기 위한 제안 방법을 작성해주세요.
      placeholder: |
        - 저장 버튼의 이벤트 핸들러 검증
        - iOS 16+ 환경에서의 UIButton 동작 확인
        - 네트워크 요청 로직 점검
  - type: textarea
    attributes:
      label: 작업 완료 기준(Acceptance Criteria)
      description: |
        버그가 해결되었다고 판단할 수 있는 기준을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 편집 모드에서 저장 버튼 클릭 시 정상 동작함
        - [ ] iOS 16 이상에서 버그 재현되지 않음
        - [ ] 변경사항이 정상적으로 저장됨
        - [ ] 관련 유닛 테스트 통과
  - type: textarea
    attributes:
      label: 원본 제안(Original Suggestion)
      description: |
        사용자가 제안한 원본 내용이나 추가 정보를 작성해주세요.
      placeholder: |
        - 스크린샷 또는 영상
        - 에러 로그
        - 재현 단계
        - 시도해본 해결방법
